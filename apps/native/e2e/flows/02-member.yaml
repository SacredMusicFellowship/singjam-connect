appId: org.singjam.app
name: The member sees their jams, including the private one they're invited to, and their top match
---
- runFlow: common/start.yaml
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: ${MEMBER_EMAIL}
- tapOn: "Jams(, tab.*)?"
- assertVisible: ".*${OFFICIAL_JAM}.*"
- takeScreenshot: jams
- scrollUntilVisible:
    element: ".*${PRIVATE_JAM}.*"
- scrollUntilVisible:
    element: ".*${OFFICIAL_JAM}.*"
    direction: UP
- tapOn: ".*${OFFICIAL_JAM}.*"
- assertVisible: ".*${OFFICIAL_JAM}.*"
- takeScreenshot: jam
- runFlow:
    when:
      platform: Android
    commands:
      - back
# Maestro's back is Android-only; on iOS, swipe back from the left edge.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
- tapOn: "Sets(, tab.*)?"
- takeScreenshot: sets
- tapOn: "Friends(, tab.*)?"
- assertVisible: ".*${HOST_NAME}.*"
- takeScreenshot: friends
- tapOn: "Repertoire(, tab.*)?"
- takeScreenshot: repertoire
- tapOn: "Profile(, tab.*)?"
- takeScreenshot: profile
