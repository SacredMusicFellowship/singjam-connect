# Runs on every pull request and on main. Everything uses fake data: unit tests mock outside
# services with MSW, and the e2e job runs a local Supabase seeded from packages/test-fixtures.
# Actions are pinned to full commit SHAs (Dependabot keeps them current); the comment is the tag.
# This repository only allows GitHub's own actions plus a short allowlist, so tools are
# installed directly where an action would pull in others.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Type check native
        # Expo and NativeWind write these when Metro starts; they're gitignored, so CI writes the same lines.
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          echo '/// <reference types="nativewind/types" />' > nativewind-env.d.ts
          npx tsc --noEmit
        working-directory: apps/native

      - name: Web unit tests
        run: npx vitest run
        working-directory: apps/web
      - name: Core unit tests
        run: npx vitest run
        working-directory: packages/core
      - name: Test fixtures unit tests
        run: npx vitest run
        working-directory: packages/test-fixtures
      - name: Native unit tests
        run: npx jest
        working-directory: apps/native
      - name: Expo doctor
        run: npx expo-doctor
        working-directory: apps/native

  e2e:
    name: Local Supabase, RLS and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Installed from the release rather than supabase/setup-cli, which pulls in an action
      # (oven-sh/setup-bun) this repository doesn't allow. The checksum is verified.
      - name: Install the Supabase CLI
        env:
          SUPABASE_CLI_VERSION: 3.0.0
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v${SUPABASE_CLI_VERSION}" --repo supabase/cli \
            --pattern "supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz" --pattern checksums.txt
          grep " supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz$" checksums.txt | sha256sum --check
          tar -xzf "supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz" supabase
          sudo install supabase /usr/local/bin/supabase
          supabase --version
      - name: Start local Supabase (every migration, then the fake seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: RLS tests
        run: npm run test:rls

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web

      - name: Playwright
        run: npx playwright test
        working-directory: apps/web

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
          retention-days: 14
