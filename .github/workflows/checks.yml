name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-rules:
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-repo-rules.mjs

  tests:
    name: Unit tests (web + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The lockfile is generated on macOS, and npm then skips the Linux build
      # of rolldown (the test runner's bundler); install the matching one.
      - run: npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"
      - run: npx vitest run
        working-directory: packages/core
      - run: npx vitest run
        working-directory: apps/web
