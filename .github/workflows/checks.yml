name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-rules:
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-repo-rules.mjs

  tests:
    name: Unit tests (web + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The lockfile is generated on macOS, and npm then skips the Linux build
      # of rolldown (the test runner's bundler); install the matching one.
      - run: npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"
      - run: npx vitest run
        working-directory: packages/core
      - run: npx vitest run
        working-directory: apps/web
